services:
  db:
    image: pgvector/pgvector:pg17
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegissecret
      POSTGRES_DB: aegisdb
    ports:
      # Published on 5433 because many machines already run a local
      # Postgres on 5432. Inside the container it is still 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegisdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: