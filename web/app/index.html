<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("aegis-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              "content",
              theme === "dark" ? "#15181a" : "#f7f5f0",
            );
        } catch (error) {
          /* storage unavailable — the light theme stands */
        }
      })();
    </script>
    <meta
      name="description"
      content="Aegis — cited answers from company policies, limited to the documents you are allowed to read."
    />
    <title>Aegis — Company policy assistant</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c4536'/%3E%3Cpath d='M16 7.5 23 10.3v5.4c0 4.4-2.9 7.3-7 8.9-4.1-1.6-7-4.5-7-8.9v-5.4L16 7.5Z' fill='none' stroke='%23f4f0e6' stroke-width='1.4' stroke-linejoin='round'/%3E%3Cpath d='m13.4 18.2 2.6-5.6 2.6 5.6M14.4 16.2h3.2' fill='none' stroke='%23f4f0e6' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
