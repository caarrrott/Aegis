[project]
name = "aegis-policy-assistant"
version = "0.1.0"
description = "A cited, access-controlled assistant for company policies"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "pgvector>=0.5.1",
    "psycopg>=3.3.7",
    "psycopg-pool>=3.3.3",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]
