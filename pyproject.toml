[project]
name = "aegis-policy-assistant"
version = "0.1.0"
description = "A cited, access-controlled assistant for company policies"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
